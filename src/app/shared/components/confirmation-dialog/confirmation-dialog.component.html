<div class="dialog-backdrop">
  <div class="dialog">
    <h3>{{ title() }}</h3>
    <p>{{ message() }}</p>
    <div class="actions">
      <button type="button" (click)="cancelled.emit()">
        Cancel
      </button>
      <button type="button" (click)="confirmed.emit()">
        Confirm
      </button>
    </div>
  </div>
</div>
